services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: transaction_platform
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d transaction_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    shm_size: 128mb
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - app-network
    command: >
      postgres -c tcp_keepalives_idle=60
               -c tcp_keepalives_interval=10
               -c tcp_keepalives_count=5
               -c idle_in_transaction_session_timeout=60000
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_platform
      SPRING_DATASOURCE_USERNAME: platform_user
      SPRING_DATASOURCE_PASSWORD: dev_password

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # Server
      SERVER_FORWARD_HEADERS_STRATEGY: native

      # Test Users
      TEST_CUSTOMER_EMAIL: customer@test.com
      TEST_CUSTOMER_PASSWORD: password123
      TEST_MERCHANT_EMAIL: merchant@test.com
      TEST_MERCHANT_PASSWORD: password123
      TEST_ADMIN_EMAIL: admin@test.com
      TEST_ADMIN_PASSWORD: password123
      TEST_AUDITOR_EMAIL: auditor@test.com
      TEST_AUDITOR_PASSWORD: password123

      # Gmail SMTP
      APP_EMAIL_MODE: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: daneen.ibrar@gmail.com
      MAIL_PASSWORD: rrakleuwvhmtanfz
      MAIL_SMTP_AUTH: true
      MAIL_STARTTLS: true

      # XERO OAUTH
      XERO_CLIENT_ID: 2512F3F3920940CBA50AFDE55D61D9C6
      XERO_CLIENT_SECRET: HRr50i4hY0B_bBIpeJNN61LhcvPc74J9ndOCIErA2GnccMqh
      XERO_REDIRECT_URI: https://potential-parakeet-gx7rj5w94q4p3v5v4-8080.app.github.dev/admin/xero/callback

      # Java Options
      JAVA_OPTS: "-Xmx512m -Xms256m -Dnetworkaddress.cache.ttl=10 -Dnetworkaddress.cache.negative.ttl=10"

    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge