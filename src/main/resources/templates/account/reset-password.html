<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · PayFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { font-family: 'Lexend Deca', -apple-system, sans-serif; font-weight: 300;
            letter-spacing: -0.011em; -webkit-font-smoothing: antialiased; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #0b1a33 0%, #1a3a6e 50%, #2d6bb8 100%);
        }
        .card {
            background: white; border-radius: 20px; padding: 44px 40px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.25);
            width: 100%; max-width: 440px;
        }
        .logo-circle {
            width: 64px; height: 64px; margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #0b1a33 0%, #2d6bb8 100%);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; box-shadow: 0 12px 28px rgba(11,26,51,0.3);
        }
        h1 { text-align: center; font-size: 1.375rem; font-weight: 500;
            letter-spacing: -0.02em; color: #0f172a; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #64748b; font-size: 0.875rem;
            font-weight: 300; margin-bottom: 24px; line-height: 1.5; }
        .flash-error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
            padding: 12px 16px; border-radius: 12px; font-size: 0.8125rem;
            margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 500;
            color: #475569; text-transform: uppercase; letter-spacing: 0.05em;
            margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 16px;
            border: 1px solid #e2e8f0; border-radius: 12px;
            font-family: inherit; font-size: 0.9375rem; font-weight: 300; }
        .form-group input:focus { outline: none; border-color: #2d6bb8;
            box-shadow: 0 0 0 4px rgba(45,107,184,0.12); }
        .help-text { font-size: 0.75rem; color: #94a3b8; margin-top: 6px; }
        .btn { width: 100%; padding: 13px 20px;
            background: linear-gradient(135deg, #0b1a33 0%, #1a3a6e 100%);
            color: white; border: none; border-radius: 12px; cursor: pointer;
            font-size: 0.9375rem; font-weight: 400; font-family: inherit;
            box-shadow: 0 8px 20px rgba(11,26,51,0.25); transition: all 0.2s ease; }
        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .footer-link { text-align: center; margin-top: 24px; font-size: 0.8125rem; }
        .footer-link a { color: #64748b; text-decoration: none; }
        .footer-link a:hover { color: #2d6bb8; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo-circle">🔐</div>
    <h1>Set a new password</h1>
    <p class="subtitle" th:if="${email}">
        Choose a new password for <strong th:text="${email}">you@example.com</strong>
    </p>
    <p class="subtitle" th:unless="${email}">Choose your new password below.</p>

    <div th:if="${error}" class="flash-error">
        <span>❌</span>
        <span th:text="${error}">Error</span>
    </div>

    <!-- Only show form if token is valid -->
    <form th:if="${token != null and error == null}" method="post" th:action="@{/reset-password}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="newPassword"
                   minlength="8" required autofocus>
            <div class="help-text">Minimum 8 characters.</div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   minlength="8" required>
        </div>

        <button type="submit" class="btn">Reset Password →</button>
    </form>

    <div th:if="${token == null or error != null}" class="footer-link" style="margin-top:20px;">
        <a href="/forgot-password">Request a new reset link</a>
    </div>

    <div class="footer-link">
        <a href="/login">← Back to sign in</a>
    </div>
</div>
</body>
</html>
