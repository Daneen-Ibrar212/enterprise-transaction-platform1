<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account · PayFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            font-family: 'Lexend Deca', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 300;
            background: #f0f4f8;
            color: #0f172a;
            letter-spacing: -0.011em;
            -webkit-font-smoothing: antialiased;
        }
        body {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 40px 24px;
            background: linear-gradient(135deg, #0b1a33 0%, #1a3a6e 50%, #2d6bb8 100%);
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: ''; position: absolute; top: -140px; right: -140px;
            width: 460px; height: 460px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; pointer-events: none;
        }
        body::after {
            content: ''; position: absolute; bottom: -180px; left: -120px;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; pointer-events: none;
        }

        .signup-card {
            position: relative; z-index: 1;
            background: white;
            border-radius: 20px;
            padding: 40px 44px;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.08);
        }

        .signup-head { text-align: center; margin-bottom: 32px; }
        .signup-head .logo {
            width: 56px; height: 56px;
            margin: 0 auto 16px auto;
            background: linear-gradient(135deg, #0b1a33 0%, #2d6bb8 100%);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 12px 28px rgba(11,26,51,0.3);
        }
        .signup-head h1 {
            font-size: 1.5rem; font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }
        .signup-head p { font-size: 0.875rem; color: #64748b; font-weight: 300; }

        .error-box {
            background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
            padding: 14px 18px; border-radius: 12px;
            font-size: 0.8125rem; font-weight: 400;
            margin-bottom: 20px;
            display: flex; align-items: flex-start; gap: 10px;
            line-height: 1.5;
        }

        .section-label {
            display: block;
            font-size: 0.7rem; font-weight: 500;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .section-hint {
            color: #94a3b8;
            font-weight: 300;
            text-transform: none;
            letter-spacing: 0;
            font-size: 0.75rem;
        }

        /* Plan pills */
        .plan-pills {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 6px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }
        .plan-pill {
            position: relative;
            cursor: pointer;
            padding: 12px 10px;
            border-radius: 10px;
            background: transparent;
            text-align: center;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }
        .plan-pill input[type="radio"] {
            position: absolute; opacity: 0; pointer-events: none;
        }
        .plan-pill:hover { background: white; }
        .plan-pill.selected {
            background: white;
            border-color: #2d6bb8;
            box-shadow: 0 4px 12px rgba(45,107,184,0.15);
        }
        .plan-pill .pill-name {
            font-size: 0.8125rem; font-weight: 500;
            color: #0f172a; margin-bottom: 2px; display: block;
        }
        .plan-pill .pill-price {
            font-size: 0.75rem; color: #64748b; font-weight: 400;
        }

        /* Role checkboxes */
        .role-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }
        .role-option {
            position: relative;
            cursor: pointer;
            padding: 16px 16px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: all 0.15s ease;
            display: block;
        }
        .role-option input[type="checkbox"] {
            position: absolute; opacity: 0; pointer-events: none;
        }
        .role-option:hover {
            border-color: #cbd5e1;
            background: white;
        }
        .role-option:has(input[type="checkbox"]:checked) {
            background: #eff6ff;
            border-color: #2d6bb8;
            box-shadow: 0 4px 12px rgba(45,107,184,0.12);
        }
        .role-option:has(input[type="checkbox"]:checked)::after {
            content: '✓';
            position: absolute;
            top: 10px; right: 12px;
            width: 20px; height: 20px;
            background: #2d6bb8;
            color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 500;
        }
        .role-option .role-title {
            font-size: 0.875rem; font-weight: 500;
            color: #0f172a;
            margin-bottom: 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .role-option .role-desc {
            font-size: 0.75rem; color: #64748b;
            font-weight: 300; line-height: 1.5;
        }

        /* Form */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }
        .form-row.single { grid-template-columns: 1fr; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.7rem; font-weight: 500;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .form-group label .required { color: #ef4444; margin-left: 2px; }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-family: inherit;
            font-weight: 300;
            color: #0f172a;
            background: white;
            transition: all 0.15s ease;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2d6bb8;
            box-shadow: 0 0 0 4px rgba(45,107,184,0.12);
        }
        .form-group input::placeholder { color: #94a3b8; font-weight: 300; }
        .form-group .help {
            font-size: 0.75rem; color: #94a3b8;
            font-weight: 300; margin-top: 6px;
        }

        .terms-row {
            display: flex; align-items: flex-start; gap: 10px;
            margin: 20px 0 24px 0;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }
        .terms-row input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: #2d6bb8;
            cursor: pointer; flex-shrink: 0;
            margin-top: 2px;
        }
        .terms-row label {
            font-size: 0.8125rem; color: #475569;
            line-height: 1.5; font-weight: 300;
            cursor: pointer;
        }
        .terms-row label a { color: #2d6bb8; text-decoration: none; font-weight: 400; }
        .terms-row label a:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #0b1a33 0%, #1a3a6e 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9375rem;
            font-weight: 400;
            font-family: inherit;
            box-shadow: 0 8px 20px rgba(11,26,51,0.25);
            transition: all 0.2s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(11,26,51,0.35);
        }
        .btn-submit:disabled {
            opacity: 0.6; cursor: not-allowed; transform: none;
        }

        .footnote {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8125rem;
            color: #64748b;
            font-weight: 300;
        }
        .footnote a { color: #2d6bb8; text-decoration: none; font-weight: 400; }
        .footnote a:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            .signup-card { padding: 32px 24px; }
            .form-row { grid-template-columns: 1fr; }
            .role-options { grid-template-columns: 1fr; }
            .plan-pills { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="signup-card">

    <div class="signup-head">
        <div class="logo">💳</div>
        <h1>Create your PayFlow account</h1>
        <p th:if="${selectedPlan != null}">
            Starting on the <strong th:text="${selectedPlan.name}">Starter</strong> plan ·
            <span th:text="${selectedPlan.formattedMonthlyPrice}">£100</span>/month
        </p>
        <p th:unless="${selectedPlan != null}">Choose a plan and get started</p>
    </div>

    <div th:if="${error}" class="error-box">
        <span style="font-size:1.125rem;">⚠️</span>
        <span th:text="${error}">Something went wrong</span>
    </div>

    <form th:action="@{/signup}" method="post" th:object="${form}">
        <!-- CSRF hidden input is injected automatically by Thymeleaf's th:action
             when Spring Security CSRF is enabled for this path. -->

        <!-- ============ PLAN ============ -->
        <span class="section-label">Choose your plan</span>
        <div class="plan-pills">
            <label th:each="plan : ${plans}" class="plan-pill"
                   th:classappend="${selectedPlan != null and plan.code == selectedPlan.code} ? ' selected' : ''">
                <input type="radio" name="planCode" th:value="${plan.code}"
                       th:checked="${selectedPlan != null and plan.code == selectedPlan.code}" required />
                <span class="pill-name" th:text="${plan.name}">Starter</span>
                <span class="pill-price" th:text="${plan.formattedMonthlyPrice} + '/mo'">£100/mo</span>
            </label>
        </div>

        <!-- ============ ROLES (multi-select) ============ -->
        <span class="section-label">
            What kind of account?
            <span class="section-hint">— pick one or several</span>
        </span>
        <div class="role-options">
            <label class="role-option">
                <input type="checkbox" name="roleIntents" value="CUSTOMER" />
                <div class="role-title">👤 Customer</div>
                <div class="role-desc">I want to receive and pay invoices. Auto-approved.</div>
            </label>
            <label class="role-option">
                <input type="checkbox" name="roleIntents" value="MERCHANT" />
                <div class="role-title">🏪 Merchant</div>
                <div class="role-desc">I want to send invoices to my customers and get paid.</div>
            </label>
            <label class="role-option">
                <input type="checkbox" name="roleIntents" value="MERCHANT_ADMIN" />
                <div class="role-title">👔 Merchant Admin</div>
                <div class="role-desc">I want to manage a team of merchants and configure settings.</div>
            </label>
        </div>
        <p class="help" style="font-size:0.75rem; color:#94a3b8; font-weight:300; margin-bottom:20px; margin-top:8px;">
            Merchant and Merchant Admin accounts require super-admin approval.
        </p>

        <!-- ============ PERSONAL DETAILS ============ -->
        <div class="form-row single" style="margin-top:20px;">
            <div class="form-group">
                <label for="fullName">Full name <span class="required">*</span></label>
                <input type="text" id="fullName" name="fullName" required
                       placeholder="Jane Smith"
                       th:value="${form != null ? form.fullName : ''}" />
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Work email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required
                       placeholder="jane@company.com"
                       autocomplete="email"
                       th:value="${form != null ? form.email : ''}" />
            </div>
            <div class="form-group">
                <label for="companyName">Company name</label>
                <input type="text" id="companyName" name="companyName"
                       placeholder="Acme Ltd"
                       th:value="${form != null ? form.companyName : ''}" />
            </div>
        </div>

        <!-- ============ PASSWORD ============ -->
        <div class="form-row">
            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input type="password" id="password" name="password" required
                       minlength="8"
                       placeholder="At least 8 characters"
                       autocomplete="new-password" />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm password <span class="required">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       minlength="8"
                       placeholder="Type it again"
                       autocomplete="new-password" />
            </div>
        </div>

        <div class="form-group">
            <label for="countryCode">Country</label>
            <select id="countryCode" name="countryCode">
                <option value="">— Select (optional) —</option>
                <option value="GB">🇬🇧 United Kingdom</option>
                <option value="US">🇺🇸 United States</option>
                <option value="DE">🇩🇪 Germany</option>
                <option value="FR">🇫🇷 France</option>
                <option value="ES">🇪🇸 Spain</option>
                <option value="IT">🇮🇹 Italy</option>
                <option value="NL">🇳🇱 Netherlands</option>
                <option value="IE">🇮🇪 Ireland</option>
                <option value="AU">🇦🇺 Australia</option>
                <option value="CA">🇨🇦 Canada</option>
                <option value="NZ">🇳🇿 New Zealand</option>
            </select>
        </div>

        <!-- ============ TERMS ============ -->
        <div class="terms-row">
            <input type="checkbox" id="terms" required />
            <label for="terms">
                I agree to the <a href="#" onclick="return false;">Terms of Service</a>
                and <a href="#" onclick="return false;">Privacy Policy</a>.
                My account starts on a 14-day free trial.
            </label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <span>Create account</span>
            <span>→</span>
        </button>
    </form>

    <div class="footnote">
        Already have an account? <a href="/login">Sign in</a>
    </div>
</div>

<script>
    // Plan pill selection
    document.querySelectorAll('.plan-pill').forEach(function(el) {
        el.addEventListener('click', function() {
            document.querySelectorAll('.plan-pill').forEach(function(o) {
                o.classList.remove('selected');
            });
            this.classList.add('selected');
        });
    });

    // Client-side password match + at-least-one-role validation
    (function() {
        var form = document.querySelector('form');
        var pw = document.getElementById('password');
        var cpw = document.getElementById('confirmPassword');
        var btn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            if (pw.value !== cpw.value) {
                e.preventDefault();
                alert('Passwords do not match');
                return;
            }
            var anyRole = document.querySelectorAll('input[name="roleIntents"]:checked').length > 0;
            if (!anyRole) {
                e.preventDefault();
                alert('Please select at least one account type');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<span>Creating account…</span>';
        });
    })();
</script>

</body>
</html>
