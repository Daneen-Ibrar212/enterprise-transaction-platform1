app:
  # Email
  email:
    mode: stub           # stub | smtp
    from: noreply@payflow.local
    from-name: PayFlow

  # Base URL for links in emails / redirects
  base-url: http://localhost:8080

  # Security
  security:
    max-failed-attempts: 5
    lock-duration-minutes: 30

  # Rate limiting
  rate-limit:
    payment-requests: 100
    payment-requests-window: 60
    read-requests: 200
    read-requests-window: 60

  # Reliability
  dlq:
    max-retry-attempts: 3
    batch-size: 10
    scheduler:
      cron: "0 */5 * * * *"

  # Webhooks
  webhook:
    hmac-secret: ${WEBHOOK_HMAC_SECRET:change-me-in-production}

  # Test user seeding — MUST be false in production
  seed:
    test-users: false

# Spring mail (only used when app.email.mode=smtp)
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false