<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Result · PayFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            font-family: 'Lexend Deca', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: 300;
            letter-spacing: -0.011em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            background: linear-gradient(135deg, #0b1a33 0%, #1a3a6e 50%, #2d6bb8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -120px; right: -120px;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            background: white;
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .icon-success {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
            box-shadow: 0 8px 24px rgba(16,185,129,0.25);
        }
        .icon-failure {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
            box-shadow: 0 8px 24px rgba(239,68,68,0.25);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 300;
            margin-bottom: 24px;
        }

        .details {
            background: #f8fafc;
            border-radius: 14px;
            padding: 20px 24px;
            margin: 24px 0;
            text-align: left;
            border: 1px solid #e2e8f0;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eef2f6;
            gap: 12px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }
        .detail-value {
            font-size: 0.875rem;
            font-weight: 400;
            color: #0f172a;
            text-align: right;
            word-break: break-word;
        }
        .detail-value.mono {
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.8125rem;
        }
        .detail-value.status {
            font-weight: 500;
            color: #065f46;
        }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.8125rem;
            font-weight: 400;
            margin: 20px 0;
            text-align: left;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 28px;
            background: linear-gradient(135deg, #0b1a33 0%, #1a3a6e 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 400;
            font-family: 'Lexend Deca', -apple-system, system-ui, sans-serif;
            letter-spacing: -0.005em;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(11,26,51,0.25);
            transition: all 0.2s ease;
            margin-top: 12px;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(11,26,51,0.35); }

        .footer-note {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #f1f5f9;
            font-weight: 300;
        }
    </style>
</head>
<body>

<div class="card">

    <!-- Success -->
    <div th:if="${response != null}">
        <div class="icon-circle icon-success">✅</div>
        <h1>Payment Successful</h1>
        <p class="subtitle">Your payment has been processed.</p>
    </div>

    <!-- Failure -->
    <div th:unless="${response != null}">
        <div class="icon-circle icon-failure">❌</div>
        <h1>Payment Failed</h1>
        <p class="subtitle">We couldn't process your payment.</p>
    </div>

    <!-- Success details -->
    <div th:if="${response != null}" class="details">
        <div class="detail-row">
            <span class="detail-label">Transaction</span>
            <span class="detail-value mono" th:text="'#' + ${response.transactionId}">#123</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Status</span>
            <span class="detail-value status" th:text="${response.status}">SETTLED</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Message</span>
            <span class="detail-value" th:text="${response.message}">Payment settled successfully</span>
        </div>
    </div>

    <!-- Error -->
    <div th:if="${error != null}" class="error-box">
        <span style="font-size:1.125rem;">⚠️</span>
        <span th:text="${error}">Error</span>
    </div>

    <a href="/" class="btn">← Return to Home</a>

    <p class="footer-note">
        For any queries, please contact the merchant.<br/>
        Powered by Enterprise Transaction Platform
    </p>
</div>

</body>
</html>
